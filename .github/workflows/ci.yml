name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - run: mvn -B verify

  boot-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [17, 21]
        spring-boot: ["3.2.12", "3.3.13", "3.4.10", "3.5.16"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - run: mvn -B verify -Dspring-boot.version=${{ matrix.spring-boot }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify -Paudit
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/target/bom.json"
          if-no-files-found: ignore
